user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Upstream Services
    upstream client_upstream {
        server client:80;
    }

    upstream auth_upstream {
        server auth-service:4001;
    }

    upstream student_upstream {
        server student-service:4002;
    }

    upstream drive_upstream {
        server company-drive-service:4003;
    }

    upstream application_upstream {
        server application-service:4004;
    }

    upstream notification_upstream {
        server notification-service:4005;
    }

    # upstream auth_upstream {
    #     zone auth_upstream 64k;
    #     resolver 127.0.0.11 valid=10s ipv6=off;
    #     server auth-service:4001 resolve;
    # }

    # upstream student_upstream {
    #     zone student_upstream 64k;
    #     resolver 127.0.0.11 valid=10s ipv6=off;
    #     server student-service:4002 resolve;
    # }

    # upstream drive_upstream {
    #     zone drive_upstream 64k;
    #     resolver 127.0.0.11 valid=10s ipv6=off;
    #     server company-drive-service:4003 resolve;
    # }

    # upstream application_upstream {
    #     zone application_upstream 64k;
    #     resolver 127.0.0.11 valid=10s ipv6=off;
    #     server application-service:4004 resolve;
    # }

    # upstream notification_upstream {
    #     zone notification_upstream 64k;
    #     resolver 127.0.0.11 valid=10s ipv6=off;
    #     server notification-service:4005 resolve;
    # }

    server {
        listen 80;
        server_name localhost;

        # Global Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gateway Health Check
        location  /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","timestamp":"$time_iso8601"}';
        }

        # Auth Service Endpoints
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Student Service Endpoints
        location /api/v1/students/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://student_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Company & Drive Service Endpoints
        # location /api/v1/drives/ {
        #     limit_req zone=api_limit burst=20 nodelay;
        #     proxy_pass http://drive_upstream/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Company and Placement Drive APIs
        location ^~ /api/v1/drives/ {
            proxy_pass http://drive_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location = /api/v1/drives {
            proxy_pass http://drive_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Job Management Endpoints (Phase 6)
        # location /api/v1/jobs/ {
        #     limit_req zone=api_limit burst=20 nodelay;
        #     proxy_pass http://drive_upstream/api/v1/jobs/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        location = /api/v1/jobs {
            proxy_pass http://drive_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location ^~ /api/v1/jobs/ {
            proxy_pass http://drive_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Application Service Endpoints
        # location /api/v1/applications/ {
        #     limit_req zone=api_limit burst=20 nodelay;
        #     proxy_pass http://application_upstream/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
        # Application API
    location = /api/v1/applications {
        proxy_pass http://application_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /api/v1/applications/ {
        proxy_pass http://application_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

        # Notification Service Endpoints
        location /api/v1/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Client SPA
        location / {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location / {
        #     try_files $uri $uri/ /index.html;
        # }
    }
}

